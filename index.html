<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phantom Clash — Ghost Duel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: radial-gradient(circle at 50% 0%, #16213e 0%, #0a0a1a 70%);
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; padding: 20px; overflow: hidden;
  }
  h1 {
    font-size: 2.6rem; letter-spacing: 3px;
    background: linear-gradient(90deg, #00f2fe, #4facfe, #a855f7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-align: center; margin-bottom: 4px;
  }
  .subtitle { color: #8a8aa8; margin-bottom: 14px; font-size: 0.9rem; letter-spacing: 1px; }
  #gameWrapper {
    position: relative; border-radius: 14px; overflow: hidden;
    box-shadow: 0 0 60px rgba(79, 172, 254, 0.25);
    background: #000; max-width: 100%;
  }
  canvas { display: block; border-radius: 14px; background: #0a0a1a; max-width: 100%; height: auto; }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(10, 10, 26, 0.94);
    text-align: center; padding: 24px; border-radius: 14px;
  }
  #overlay h2 {
    font-size: 1.7rem; margin-bottom: 12px;
    background: linear-gradient(90deg, #00f2fe, #a855f7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  #overlay p { color: #c0c0d8; margin-bottom: 6px; line-height: 1.7; font-size: 0.95rem; }
  #overlay button {
    margin-top: 18px; padding: 13px 34px;
    font-size: 1rem; font-weight: bold; color: #fff;
    background: linear-gradient(90deg, #4facfe, #a855f7);
    border: none; border-radius: 30px; cursor: pointer;
    letter-spacing: 2px; transition: transform 0.2s, box-shadow 0.2s;
  }
  #overlay button:hover { transform: scale(1.06); box-shadow: 0 0 25px rgba(168,85,247,0.6); }
  .hidden { display: none !important; }
  .hud {
    display: flex; justify-content: space-between;
    width: 800px; max-width: 100%; margin-top: 12px;
    font-size: 0.9rem; color: #8a8aa8; padding: 0 8px;
  }
  .hud b { color: #4facfe; }
  .hud .ghostB { color: #e0e0ff; }
  .key {
    display: inline-block; padding: 2px 9px;
    background: #2a2a4a; border-radius: 5px;
    font-family: monospace; color: #4facfe; font-weight: bold; margin: 0 2px;
  }
</style>
</head>
<body>

<h1>PHANTOM CLASH</h1>
<div class="subtitle">RACE AGAINST YOUR GHOST · BEAT YOUR PAST SELF</div>

<div id="gameWrapper">
  <canvas id="game" width="800" height="420"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">PHANTOM CLASH</h2>
    <p id="ovText">
      Press <span class="key">SPACE</span> / <span class="key">↑</span> / tap to jump (double-jump allowed).<br>
      Dodge obstacles. Run as far as you can.<br>
      Your movement is saved as a <b style="color:#e0e0ff">GHOST</b> — then race it.
    </p>
    <button id="ovBtn">START</button>
  </div>
</div>

<div class="hud">
  <span>Distance: <b id="hudScore">0</b>m</span>
  <span>Ghost: <b class="ghostB" id="hudGhost">—</b></span>
  <span>Best: <b id="hudBest">0</b>m</span>
</div>

<script>
(() => {
  // ============ SETUP ============
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const overlay  = document.getElementById('overlay');
  const ovTitle  = document.getElementById('ovTitle');
  const ovText   = document.getElementById('ovText');
  const ovBtn    = document.getElementById('ovBtn');
  const hudScore = document.getElementById('hudScore');
  const hudGhost = document.getElementById('hudGhost');
  const hudBest  = document.getElementById('hudBest');

  // ============ CONFIG ============
  const GROUND_Y       = H - 70;
  const GRAVITY        = 0.9;
  const JUMP_POWER     = -15;
  const BASE_SPEED     = 6;
  const MAX_SPEED_BONUS= 6;
  const PLAYER_SIZE    = 34;
  const START_X        = 130;
  const RECORD_EVERY   = 2;
  const MAX_RECORD     = 30000;

  // ============ STATE ============
  let state = 'menu';   // menu | playing | ghostPlay | gameover
  let mode  = 'record'; // record | race
  let player, obstacles, particles;
  let groundOffset, speed, distance, frame;
  let spawnTimer = 90;
  let ghostIndex = 0;
  let lastRunWasGhost = false;

  let recordedFrames = [];
  let savedGhostFrames = safeParse(localStorage.getItem('pc_ghost_frames'), []);
  let savedGhostDist   = +(localStorage.getItem('pc_ghost_dist') || 0);
  let bestDistance     = +(localStorage.getItem('pc_best') || 0);

  if (savedGhostFrames.length > 0) mode = 'race';
  hudBest.textContent = bestDistance;

  function safeParse(s, fb) { try { return JSON.parse(s) || fb; } catch(e) { return fb; } }

  // ============ AUDIO (WebAudio beeps, no files) ============
  let actx = null;
  function beep(freq, dur, type='sine', vol=0.07) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch(e) {}
  }

  // ============ HELPERS ============
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ============ RESET ============
  function resetGame() {
    player = {
      x: START_X, y: GROUND_Y - PLAYER_SIZE,
      vy: 0, w: PLAYER_SIZE, h: PLAYER_SIZE, jumps: 0
    };
    obstacles = [];
    particles = [];
    groundOffset = 0;
    speed = BASE_SPEED;
    distance = 0;
    frame = 0;
    spawnTimer = 90;
    ghostIndex = 0;
    recordedFrames = [];
  }

  // ============ INPUT ============
  function triggerJump() {
    if (state === 'playing' || state === 'ghostPlay') {
      if (player.jumps < 2) {
        player.vy = JUMP_POWER;
        player.jumps++;
        beep(460, 0.07, 'triangle');
        for (let i = 0; i < 6; i++) {
          particles.push({
            x: player.x + player.w/2, y: player.y + player.h,
            vx: (Math.random()-0.5)*4, vy: -Math.random()*3,
            life: 28, color: '#4facfe'
          });
        }
      }
    } else if (state === 'menu' || state === 'gameover') {
      startAttempt();
    }
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault(); triggerJump();
    }
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); triggerJump(); });
  ovBtn.addEventListener('click', startAttempt);

  // ============ START ============
  function startAttempt() {
    if (state === 'playing' || state === 'ghostPlay') return;
    resetGame();

    if (mode === 'race' && savedGhostFrames.length > 0) {
      state = 'ghostPlay';
      lastRunWasGhost = true;
      mode = 'record';
      hudGhost.textContent = savedGhostDist;
    } else {
      state = 'playing';
      lastRunWasGhost = false;
      mode = 'race';
      hudGhost.textContent = savedGhostDist || '—';
    }
    overlay.classList.add('hidden');
    beep(700, 0.1, 'square');
  }

  // ============ SPAWN ============
  function spawnObstacle() {
    const h = 28 + Math.random() * 42;
    const w = 24 + Math.random() * 28;
    obstacles.push({ x: W + 20, y: GROUND_Y - h, w, h });
  }

  // ============ UPDATE ============
  function update() {
    if (state !== 'playing' && state !== 'ghostPlay') return;

    frame++;
    speed = BASE_SPEED + Math.min(distance / 900, MAX_SPEED_BONUS);
    distance += speed;
    groundOffset = (groundOffset + speed) % 40;

    // physics
    player.vy += GRAVITY;
    player.y += player.vy;
    if (player.y >= GROUND_Y - player.h) {
      if (!player.jumps && player.vy > 3) beep(200, 0.05, 'sine', 0.04);
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.jumps = 0;
    }

    // obstacles
    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = Math.max(42, 90 - Math.floor(distance / 400));
    }
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed;
      if (o.x + o.w < 0) obstacles.splice(i, 1);
    }

    // collision
    for (const o of obstacles) {
      if (player.x < o.x + o.w &&
          player.x + player.w > o.x &&
          player.y < o.y + o.h &&
          player.y + player.h > o.y) {
        endGame();
        return;
      }
    }

    // record
    if (state === 'playing' && recordedFrames.length < MAX_RECORD) {
      if (frame % RECORD_EVERY === 0) {
        recordedFrames.push({ y: Math.round(player.y), d: Math.round(distance) });
      }
    }

    // ghost playback index
    if (state === 'ghostPlay' && savedGhostFrames.length > 0) {
      while (ghostIndex < savedGhostFrames.length - 1 &&
             savedGhostFrames[ghostIndex].d < distance) {
        ghostIndex++;
      }
    }

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    hudScore.textContent = Math.floor(distance / 10);
  }

  // ============ END ============
  function endGame() {
    state = 'gameover';
    beep(140, 0.35, 'sawtooth', 0.09);
    const finalDist = Math.floor(distance / 10);

    for (let i = 0; i < 30; i++) {
      particles.push({
        x: player.x + player.w/2, y: player.y + player.h/2,
        vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
        life: 40, color: Math.random() > 0.5 ? '#ff4466' : '#4facfe'
      });
    }

    if (!lastRunWasGhost) {
      // Save new ghost
      savedGhostFrames = recordedFrames.slice();
      savedGhostDist = finalDist;
      try {
        localStorage.setItem('pc_ghost_frames', JSON.stringify(savedGhostFrames));
        localStorage.setItem('pc_ghost_dist', savedGhostDist);
      } catch(e) {}
      if (finalDist > bestDistance) {
        bestDistance = finalDist;
        localStorage.setItem('pc_best', bestDistance);
        hudBest.textContent = bestDistance;
      }
      ovTitle.textContent = 'GHOST RECORDED';
      ovText.innerHTML =
        `You ran <b style="color:#4facfe">${finalDist}m</b>.<br>` +
        `Your ghost is now chasing you next round.<br><br>` +
        `Can you beat yourself?`;
      ovBtn.textContent = 'RACE YOUR GHOST';
    } else {
      const g = savedGhostDist;
      let win = finalDist > g, tie = finalDist === g;
      let msg;
      if (win) {
        msg = `🏆 <b style="color:#22c55e">YOU BEAT YOUR GHOST!</b><br>You: ${finalDist}m &nbsp; Ghost: ${g}m`;
        beep(900, 0.18); setTimeout(() => beep(1300, 0.25), 160);
      } else if (tie) {
        msg = `⚔️ <b style="color:#facc15">TIE!</b><br>You: ${finalDist}m &nbsp; Ghost: ${g}m`;
      } else {
        msg = `👻 <b style="color:#e0e0ff">Ghost wins!</b><br>You: ${finalDist}m &nbsp; Ghost: ${g}m`;
      }
      ovTitle.textContent = win ? 'VICTORY!' : (tie ? 'DRAW' : 'GHOST WINS');
      ovText.innerHTML = msg + '<br><br>A new recording will start.';
      ovBtn.textContent = 'PLAY AGAIN';
    }

    overlay.classList.remove('hidden');
  }

  // ============ RENDER ============
  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#0a0a1a');
    sky.addColorStop(0.55, '#16213e');
    sky.addColorStop(1, '#0f3460');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for (let i = 0; i < 50; i++) {
      const sx = (i * 137 + frame * 0.25) % W;
      const sy = (i * 89) % (H - 150);
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }

    ctx.fillStyle = 'rgba(40, 60, 100, 0.45)';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= W; x += 40) {
      const y = GROUND_Y - 45 - Math.sin((x + frame) * 0.006) * 28;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, GROUND_Y);
    ctx.fill();
  }

  function drawGround() {
    ctx.fillStyle = '#1a1a3e';
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    ctx.strokeStyle = '#4facfe';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y);
    ctx.stroke();
    ctx.fillStyle = '#2a2a5a';
    for (let x = -groundOffset; x < W; x += 40) ctx.fillRect(x, GROUND_Y + 12, 20, 3);
    ctx.fillStyle = 'rgba(79,172,254,0.28)';
    for (let x = -groundOffset; x < W; x += 40) ctx.fillRect(x + 6, GROUND_Y + 28, 10, 2);
  }

  function drawObstacles() {
    for (const o of obstacles) {
      ctx.shadowColor = '#ff4466';
      ctx.shadowBlur = 14;
      const g = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
      g.addColorStop(0, '#ff4466');
      g.addColorStop(1, '#a855f7');
      ctx.fillStyle = g;
      rr(o.x, o.y, o.w, o.h, 5); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fillRect(o.x + 4, o.y + 4, o.w - 8, 3);
    }
  }

  function drawGhost() {
    if (state !== 'ghostPlay' || savedGhostFrames.length === 0) return;
    const gf = savedGhostFrames[Math.min(ghostIndex, savedGhostFrames.length - 1)];
    if (!gf) return;
    const gx = player.x;
    const gy = gf.y;
    ctx.globalAlpha = 0.35;
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#dcdcff';
    rr(gx, gy, player.w, player.h, 8); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#a855f7';
    ctx.beginPath();
    ctx.arc(gx + player.w*0.35, gy + player.h*0.4, 3, 0, Math.PI*2);
    ctx.arc(gx + player.w*0.65, gy + player.h*0.4, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawPlayer() {
    const { x, y, w, h } = player;
    ctx.shadowColor = '#4facfe';
    ctx.shadowBlur = 20;
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, '#4facfe');
    g.addColorStop(1, '#a855f7');
    ctx.fillStyle = g;
    rr(x, y, w, h, 8); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x + w*0.35, y + h*0.42, 4.5, 0, Math.PI*2);
    ctx.arc(x + w*0.65, y + h*0.42, 4.5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#0a0a1a';
    ctx.beginPath();
    ctx.arc(x + w*0.35 + 1, y + h*0.42, 2, 0, Math.PI*2);
    ctx.arc(x + w*0.65 + 1, y + h*0.42, 2, 0, Math.PI*2);
    ctx.fill();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 40);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    drawBackground();
    drawGround();
    drawObstacles();
    drawGhost();
    drawPlayer();
    drawParticles();
  }

  // ============ LOOP ============
  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  resetGame();
  loop();
})();
</script>
</body>
  </html>
